<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Startup Blog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#0f172a;
  color:#fff;
  overflow-x:hidden;
}

/* HEADER */
header{
  padding:20px 50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:fixed;
  width:100%;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
  z-index:1000;
}

header h1{
  color:#22c55e;
}

nav a{
  margin-left:20px;
  text-decoration:none;
  color:#fff;
}

nav a:hover{
  color:#22c55e;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h2{
  font-size:3rem;
  margin-bottom:20px;
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  background:#22c55e;
  border:none;
  border-radius:30px;
  color:#000;
  cursor:pointer;
}

/* BLOGS */
.blogs{
  padding:100px 50px;
}

.blog-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
}

.card p{
  opacity:0.7;
  margin:10px 0;
}

/* POPUPS */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:#1e293b;
  padding:30px;
  border-radius:15px;
  transition:0.3s;
  width:90%;
  max-width:600px;
  max-height:80vh;
  overflow-y:auto;
}

.popup.active{
  transform:translate(-50%,-50%) scale(1);
}

/* BLOG CONTENT STYLING */
#blogContent h2{margin-bottom:10px;}
#blogContent h3{margin-top:15px;color:#22c55e;}
#blogContent p{opacity:0.85;line-height:1.6;}
#blogContent ul{padding-left:20px;margin:10px 0;}

footer{
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>MyStartup</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#blogs">Blogs</a>
  </nav>
</header>

<section class="hero">
  <h2>Building the Future 🚀</h2>
  <p>Follow my startup journey</p>
  <button class="btn" onclick="openSubscribe()">Subscribe</button>
</section>

<section class="blogs" id="blogs">
  <h2>Latest Blogs</h2>
  <div class="blog-container" id="blogContainer"></div>
</section>

<!-- Subscribe Popup -->
<div class="popup" id="subscribePopup">
  <h3>Subscribe</h3>
  <input type="email" placeholder="Enter email" style="padding:10px;width:100%;margin:10px 0;border-radius:10px;border:none;">
  <button class="btn" onclick="closeSubscribe()">Close</button>
</div>

<!-- Blog Popup -->
<div class="popup" id="blogPopup">
  <div id="blogContent"></div>
  <button class="btn" onclick="closeBlog()">Close</button>
</div>

<footer>
  <p>© 2026 MyStartup</p>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const blogs = [
{
  title: "My Research Journey in Regenerative Medicine",
  preview: "Exploring how AI, stem cells, hyperspectral imaging, and data science are shaping the future of healing...",
  content: `
  <h2>🧬 My Journey into Regenerative Medicine</h2>

  <p>Regenerative medicine isn’t just another research field—it represents a fundamental shift in how we approach healthcare. Instead of managing symptoms or slowing disease progression, the focus is on <b>restoring, replacing, or regenerating damaged tissues and organs</b>.</p>

  <p>This idea of “healing by rebuilding” is what drew me into this domain, especially from a data science perspective.</p>

  <h3>🌱 What is Regenerative Medicine?</h3>
  <p>Regenerative medicine combines biology, engineering, and computational intelligence to repair or recreate human tissues.</p>

  <ul>
    <li><b>Stem Cell Therapy</b> – using undifferentiated cells to regenerate damaged tissues</li>
    <li><b>Tissue Engineering</b> – building biological structures using scaffolds and biomaterials</li>
    <li><b>Gene Editing</b> – modifying genetic material to correct abnormalities</li>
  </ul>

  <p>What makes this field powerful is its interdisciplinary nature—it sits at the intersection of medicine, AI, and systems engineering.</p>

  <h3>🔬 My Research Focus</h3>

  <h4>1. Predicting Tissue Regeneration Outcomes</h4>
  <p>I explored how machine learning models can be used to predict patient responses to regenerative therapies. By analyzing biological markers and historical datasets, we can estimate:</p>
  <ul>
    <li>Recovery probability</li>
    <li>Treatment effectiveness</li>
    <li>Optimal therapy pathways</li>
  </ul>

  <p>This introduces a shift toward <b>predictive and personalized healthcare</b>.</p>

  <h4>2. Hyperspectral Imaging for Biomedical Analysis</h4>
  <p>One of the most interesting parts of my research was connecting my previous work in hyperspectral data (soil analysis) to biomedical applications.</p>

  <p>Hyperspectral imaging captures detailed spectral information that can reveal hidden biochemical properties. In a medical context, this can be used for:</p>
  <ul>
    <li>Tissue composition analysis</li>
    <li>Early disease detection</li>
    <li>Monitoring regeneration at a cellular level</li>
  </ul>

  <p>This showed me how solutions from one domain can unlock innovation in another.</p>

  <h4>3. Optimization in Tissue Engineering</h4>
  <p>I also explored how optimization algorithms can improve tissue engineering processes.</p>

  <ul>
    <li>Genetic Algorithms for scaffold design</li>
    <li>Ant Colony Optimization for nutrient flow efficiency</li>
    <li>Simulation models for improving regeneration success</li>
  </ul>

  <p>This is where computational intelligence directly contributes to biological outcomes.</p>

  <h3>🧠 Key Insights</h3>

  <ul>
    <li><b>Data is the backbone</b> – regenerative medicine generates complex biological data that requires AI for interpretation</li>
    <li><b>Personalization is critical</b> – every patient responds differently, making one-size-fits-all treatment ineffective</li>
    <li><b>Integration is the future</b> – combining AI with healthcare systems can significantly improve outcomes</li>
  </ul>

  <h3>🚀 Challenges in the Field</h3>

  <ul>
    <li>High cost of regenerative treatments</li>
    <li>Ethical concerns, especially around stem cell usage</li>
    <li>Scalability limitations in clinical environments</li>
    <li>Fragmented and limited biomedical datasets</li>
  </ul>

  <p>These are not just scientific challenges—they are system-level problems that require technological solutions.</p>

  <h3>🌍 Future Vision</h3>

  <p>The future of healthcare is moving toward:</p>

  <ul>
    <li>Bioprinting functional organs</li>
    <li>Reversing chronic diseases instead of managing them</li>
    <li>AI-driven predictive healthcare systems</li>
  </ul>

  <p>We are transitioning from:</p>
  <p><b>Reactive → Predictive → Regenerative healthcare</b></p>

  <h3>🔗 Connection to My Startup</h3>

  <p>This research strongly influences my vision of building a healthcare SaaS platform.</p>

  <p>My goal is to integrate:</p>
  <ul>
    <li>Predictive analytics for patient outcomes</li>
    <li>Smart hospital resource management</li>
    <li>AI-driven treatment recommendations</li>
  </ul>

  <p>Ultimately, I aim to build systems that don’t just manage hospital operations—but actively contribute to improving patient health outcomes.</p>

  <h3>✍️ Final Thoughts</h3>

  <p>Regenerative medicine is still evolving, but its potential is undeniable.</p>

  <p><b>The future of healthcare won’t just treat diseases—it will rebuild life itself.</b></p>

  <p>And this is just the beginning of my journey in exploring that future.</p>
  `
},
{
  title: "Building ML Modules for SaaS: Learning, Experimenting, and Scaling Intelligence",
  preview: "How I explored modern machine learning methods to build scalable, production-ready ML modules for a SaaS platform...",
  content: `
  <h2>🤖 Building ML Modules for SaaS</h2>

  <p>In today’s software landscape, adding machine learning to a SaaS product is no longer optional—it’s becoming the core differentiator. But building ML systems for real-world applications is very different from training models in notebooks.</p>

  <p>This blog captures my journey of learning new machine learning methods and translating them into <b>production-ready modules for a SaaS platform</b>.</p>

  <h3>🚀 Why ML in SaaS?</h3>
  <p>Traditional SaaS applications focus on workflows and data storage. ML-powered SaaS goes a step further:</p>

  <ul>
    <li>Predicts outcomes instead of just displaying data</li>
    <li>Automates decision-making</li>
    <li>Continuously improves using real-time data</li>
  </ul>

  <p>For example, in a healthcare SaaS system, ML can predict patient inflow, optimize doctor allocation, or estimate treatment success rates.</p>

  <h3>📚 Learning New Methods</h3>
  <p>Instead of sticking to basic models, I explored modern approaches to make the system more intelligent and scalable.</p>

  <h4>1. Ensemble Learning</h4>
  <p>Combining multiple models like Random Forest and Gradient Boosting improved prediction accuracy and reduced overfitting.</p>

  <h4>2. Deep Learning</h4>
  <p>I experimented with neural networks for handling complex patterns in high-dimensional data, especially useful for healthcare and spectral datasets.</p>

  <h4>3. Feature Engineering & Selection</h4>
  <p>High-quality features often matter more than the model itself. I used techniques like PCA and correlation analysis to reduce noise and improve performance.</p>

  <h4>4. Real-Time Prediction Pipelines</h4>
  <p>Moving from static models to real-time predictions required designing pipelines that can process incoming data and update outputs instantly.</p>

  <h3>🧱 Designing ML Modules for SaaS</h3>

  <p>Instead of building one big model, I focused on modular design:</p>

  <ul>
    <li><b>Prediction Module</b> – handles model inference</li>
    <li><b>Training Module</b> – retrains models with new data</li>
    <li><b>Data Processing Module</b> – cleans and transforms input data</li>
    <li><b>API Layer</b> – connects ML models with frontend/backend</li>
  </ul>

  <p>This modular approach makes the system scalable and easier to maintain.</p>

  <h3>⚙️ Challenges Faced</h3>

  <ul>
    <li>Handling inconsistent real-world data</li>
    <li>Balancing model accuracy with performance</li>
    <li>Deploying models efficiently</li>
    <li>Ensuring scalability across multiple users (multi-tenant SaaS)</li>
  </ul>

  <p>These challenges pushed me to think beyond algorithms and focus on system design.</p>

  <h3>🧠 Key Insights</h3>

  <ul>
    <li><b>Models are just one part</b> – pipelines and deployment matter more</li>
    <li><b>Scalability is critical</b> – SaaS systems must handle multiple clients</li>
    <li><b>Automation is powerful</b> – retraining and updating models should be continuous</li>
  </ul>

  <h3>🌍 Future Direction</h3>

  <p>The next step is to make ML modules more intelligent and autonomous:</p>

  <ul>
    <li>AutoML for automatic model selection</li>
    <li>Continuous learning systems</li>
    <li>Integration with real-time dashboards</li>
  </ul>

  <p>The goal is to build systems that don’t just respond—but <b>learn, adapt, and evolve</b>.</p>

  <h3>🔗 Final Thoughts</h3>

  <p>Building ML modules for SaaS is not just about applying algorithms—it’s about designing intelligent systems that scale in the real world.</p>

  <p><b>The real power of ML in SaaS lies in turning data into decisions.</b></p>

  <p>And this is just the beginning of building truly intelligent applications.</p>
  `
}

];

const container = document.getElementById("blogContainer");

function loadBlogs(){
  blogs.forEach((blog, index) => {
    const card = document.createElement("div");
    card.classList.add("card");
    card.innerHTML = `
      <h3>${blog.title}</h3>
      <p>${blog.preview}</p>
      <button class="btn" onclick="openBlog(${index})">Read More</button>
    `;
    container.appendChild(card);
  });
}

function openBlog(index){
  document.getElementById("blogContent").innerHTML = blogs[index].content;
  document.getElementById("blogPopup").classList.add("active");
}

function closeBlog(){
  document.getElementById("blogPopup").classList.remove("active");
}

function openSubscribe(){
  document.getElementById("subscribePopup").classList.add("active");
}

function closeSubscribe(){
  document.getElementById("subscribePopup").classList.remove("active");
}

window.onload = loadBlogs;
window.openBlog = openBlog;
window.closeBlog = closeBlog;
window.openSubscribe = openSubscribe;
window.closeSubscribe = closeSubscribe;
</script>

</body>
</html>
